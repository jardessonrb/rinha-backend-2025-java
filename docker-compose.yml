services:
  mongo:
    image: mongo:7.0.5-jammy
    container_name: mongo
    hostname: mongo
    ports:
      - "27017:27017"
    networks:
      - payment-processor
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin

  api01: &api
    image: rinha2025-api:latest
    container_name: api01
    hostname: api01
    depends_on:
      - mongo
    expose:
      - "8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://admin:admin@mongo:27017/rinha2025?authSource=admin
    networks:
      - payment-processor

  api02:
    <<: *api
    container_name: api02
    hostname: api02
    networks:
      - payment-processor

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    networks:
      - payment-processor
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999"]
      interval: 5s
      timeout: 2s
      retries: 3

networks:
  payment-processor:
    external: true
