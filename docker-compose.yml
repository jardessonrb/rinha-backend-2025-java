version: "3.9"
services:
  mongo:
    image: mongo:8.0.12
    container_name: mongo
    hostname: mongo
    restart: always
    ports:
      - "27017:27017"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "120MB"

  api01: &api
    build: .
    container_name: api01
    hostname: api01
    depends_on:
      - mongo
    expose:
      - "8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/rinha2025
    networks:
      - app-net
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "80MB"

  api02:
    <<: *api
    container_name: api02
    hostname: api02
    networks:
      - app-net
      - payment-processor

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    networks:
      - app-net
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "50MB"

networks:
  app-net:
    driver: bridge
  payment-processor: # <- adicionado aqui
    external: true
